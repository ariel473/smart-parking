name: Docker Build

# Run on every push to any branch
on: push

jobs:
  build:
    runs-on: ubuntu-latest          # a clean Linux machine from GitHub, with Docker already installed
    steps:
      - name: Checkout code
        uses: actions/checkout@v5   # pulls the repo's code onto the machine

      - name: Build all images
        run: docker compose build   # builds every service in docker-compose.yml; fails = red X
